# Locke: release pipeline.
# Triggered by a composite-version tag (e.g. 26.3.5-1 = Keycloak 26.3.5, Locke
# build 1). Builds the distribution, builds and pushes the container image to
# GHCR, and cuts a GitHub release.
name: locke-release

on:
  push:
    tags:
      # GitHub filter globs don't reliably support [0-9] character-class chains.
      # '*.*.*-*' matches composite versions like 26.3.5-1 (three dotted parts +
      # a build suffix) without matching bare tags. Verified empirically.
      - '*.*.*-*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.repository == 'sky-cloak/locke'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/sky-cloak/locke
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build distribution
        run: ./mvnw -pl quarkus/dist -am -B -DskipTests install

      - name: Stage dist tarball
        run: |
          mkdir -p build
          cp quarkus/dist/target/keycloak-*.tar.gz build/

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The upstream container Dockerfile must build with context =
          # quarkus/container (ADD ubi-null.sh + local KEYCLOAK_DIST need the
          # tarball and script inside the context). See quarkus/container/README.md.
          cp build/keycloak-*.tar.gz quarkus/container/
          DIST_FILE="$(basename "$(ls build/keycloak-*.tar.gz)")"
          docker build quarkus/container \
            --build-arg KEYCLOAK_DIST="$DIST_FILE" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Mirror image to Quay and Docker Hub
        # Each registry is independent and skipped when its credentials are absent.
        # Checks are on env vars (never secrets.* in a step-level if:) so the step always exists.
        env:
          QUAY_USER:       ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN:      ${{ secrets.QUAY_TOKEN }}
          DOCKERHUB_USER:  ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          QUAY_IMAGE:      quay.io/skycloak/locke
          DOCKERHUB_IMAGE: docker.io/skycloak/locke
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "$QUAY_TOKEN" ]; then
            echo "Mirroring to $QUAY_IMAGE"
            echo "$QUAY_TOKEN" | docker login quay.io -u "$QUAY_USER" --password-stdin
            docker tag "$IMAGE:$TAG" "$QUAY_IMAGE:$TAG";   docker push "$QUAY_IMAGE:$TAG"
            docker tag "$IMAGE:$TAG" "$QUAY_IMAGE:latest"; docker push "$QUAY_IMAGE:latest"
          else
            echo "Quay credentials not set; skipping Quay."
          fi
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "Mirroring to $DOCKERHUB_IMAGE"
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USER" --password-stdin
            docker tag "$IMAGE:$TAG" "$DOCKERHUB_IMAGE:$TAG";   docker push "$DOCKERHUB_IMAGE:$TAG"
            docker tag "$IMAGE:$TAG" "$DOCKERHUB_IMAGE:latest"; docker push "$DOCKERHUB_IMAGE:latest"
          else
            echo "Docker Hub credentials not set; skipping Docker Hub."
          fi

      - name: Generate release notes
        run: |
          {
            echo "## Locke ${GITHUB_REF_NAME}"
            echo ""
            echo "Keycloak base: \`${GITHUB_REF_NAME%-*}\` · Locke build: \`${GITHUB_REF_NAME##*-}\`"
            echo ""
            echo "Image: \`${IMAGE}:${GITHUB_REF_NAME}\`"
            echo ""
            echo "See [COMPATIBILITY.md](./COMPATIBILITY.md) and [benchmark/RESULTS.md](./benchmark/RESULTS.md)."
          } > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Locke ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            build/keycloak-*.tar.gz
