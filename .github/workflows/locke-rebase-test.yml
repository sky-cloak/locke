# Locke: daily rebase test against upstream Keycloak.
# Tells us within hours whether Locke still rebases cleanly onto keycloak/keycloak
# main, and whether it still builds after the rebase. Opens a tracking issue on
# failure so a human can resolve the conflict before it compounds.
name: locke-rebase-test

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch: {}

# Only meaningful on the canonical repo; skip on community forks.
permissions:
  contents: read
  issues: write

jobs:
  rebase:
    if: github.repository == 'sky-cloak/locke'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Locke main (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure identity
        run: |
          git config user.name  "locke-ci"
          git config user.email "ci@skycloak.io"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/keycloak/keycloak.git
          git fetch upstream main --depth=200

      - name: Attempt rebase onto upstream/main
        id: rebase
        run: |
          if git rebase upstream/main; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "Conflicting files:" > /tmp/conflict.txt
            git diff --name-only --diff-filter=U >> /tmp/conflict.txt
            git rebase --abort || true
          fi

      - name: Set up JDK 21
        if: steps.rebase.outputs.result == 'clean'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build after rebase (dist + redis module)
        if: steps.rebase.outputs.result == 'clean'
        run: ./mvnw -pl model/redis,quarkus/dist -am -B -DskipTests install

      - name: Open issue on rebase conflict
        if: steps.rebase.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure the label exists (idempotent).
          gh label create rebase-conflict --color B60205 \
            --description "Daily upstream rebase conflict" --force 2>/dev/null || true
          # De-dupe: don't pile up a new issue while one is already open.
          OPEN=$(gh issue list --label rebase-conflict --state open --json number --jq 'length')
          if [ "${OPEN:-0}" != "0" ]; then
            echo "An open rebase-conflict issue already exists; skipping."
            exit 0
          fi
          # Build the body in a file, then create the issue via the REST API.
          # `gh issue create --label` resolves labels over GraphQL and returns a
          # misleading "label not found" under the Actions GITHUB_TOKEN even when the
          # label exists; the REST issues endpoint takes the label inline reliably.
          {
            echo "Automated daily rebase onto \`upstream/main\` failed."
            echo ""
            echo '```'
            cat /tmp/conflict.txt
            echo '```'
            echo ""
            echo "Resolve locally: \`git fetch upstream && git rebase upstream/main\`."
          } > /tmp/issue-body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="Rebase conflict against upstream Keycloak ($(date -u +%Y-%m-%d))" \
            -F body=@/tmp/issue-body.md \
            -f 'labels[]=rebase-conflict' >/dev/null
