# Locke: rebase the patch set onto a newer Keycloak version.
# Runs scripts/rebase-onto.sh. On a clean build it opens a PR; on a conflict or
# new-SPI-method breakage it opens an issue with the precise checklist of what a
# human needs to resolve.
name: locke-bump

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Upstream Keycloak version to rebase onto (e.g. 26.7.0)"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  bump:
    if: github.repository == 'sky-cloak/locke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure git + upstream remote
        run: |
          git config user.name  "locke-ci"
          git config user.email "ci@skycloak.io"
          git remote add upstream https://github.com/keycloak/keycloak.git || true

      - name: Rebase onto target
        id: rebase
        env:
          UPSTREAM_REMOTE: upstream
          TARGET: ${{ inputs.target_version }}
        run: |
          set +e
          bash scripts/rebase-onto.sh "$TARGET" main > /tmp/bump.log 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          tail -c 60000 /tmp/bump.log

      - name: Open issue (conflict or new SPI methods)
        if: steps.rebase.outputs.code == '3' || steps.rebase.outputs.code == '4' || steps.rebase.outputs.code == '5'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target_version }}
        run: |
          {
            echo "Automated rebase onto Keycloak \`$TARGET\` stopped and needs a human."
            echo ""
            echo "Tail of the run (the checklist is here):"
            echo ""
            echo '```'
            tail -c 8000 /tmp/bump.log
            echo '```'
          } > /tmp/issue-body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="Rebase onto Keycloak $TARGET needs attention" \
            -F body=@/tmp/issue-body.md \
            -f "labels[]=rebase"

      - name: Push branch + open PR (success)
        if: steps.rebase.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target_version }}
        run: |
          git push -f origin "locke-$TARGET"
          {
            echo "Automated rebase onto Keycloak \`$TARGET\` built clean: \`model/redis\` compiles and the dist assembles."
            echo ""
            echo "Review, then release by tagging:"
            echo ""
            echo '```'
            echo "git tag -a ${TARGET}-1 -m 'Locke ${TARGET}-1' && git push origin ${TARGET}-1"
            echo '```'
          } > /tmp/pr-body.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="Locke on Keycloak $TARGET" \
            -F body=@/tmp/pr-body.md \
            -f head="locke-$TARGET" \
            -f base=main || echo "PR may already exist for locke-$TARGET"
