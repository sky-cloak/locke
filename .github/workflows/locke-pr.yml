# Locke: PR build, test, and benchmark.
# Builds the redis module + dist, runs its tests, then runs a short clustered
# benchmark and comments the throughput parity vs vanilla on the PR.
name: locke-pr

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + test redis module
        run: ./mvnw -pl model/redis -am -B install

  benchmark:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build dist + image
        run: |
          ./mvnw -pl quarkus/dist -am -B -DskipTests install
          cp quarkus/dist/target/keycloak-*.tar.gz benchmark/
          # The Dockerfile references `ubi-null.sh` relative to its own dir, so the
          # build context must be `quarkus/container/`, not the repo root. Stage the
          # tarball into the same dir and pass its basename to the build-arg. Mirrors
          # the pattern in locke-release.yml.
          cp quarkus/dist/target/keycloak-*.tar.gz quarkus/container/
          DIST_FILE="$(basename "$(ls quarkus/dist/target/keycloak-*.tar.gz)")"
          docker build quarkus/container \
            --build-arg KEYCLOAK_DIST="$DIST_FILE" \
            -t localhost:5011/keycloak:999.0.0-redis-iter7

      - name: Run clustered parity sweep (short)
        run: |
          cd benchmark/load-test/scripts
          ./clustered-throughput-sweep.sh "20" 30 || true

      - name: Comment parity on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PARITY_FILE=$(ls -t benchmark/load-test/results/*/clustered-426/parity.txt 2>/dev/null | head -1)
          if [ -f "$PARITY_FILE" ]; then
            {
              echo "### Clustered throughput parity (B3 Redis / A3 Infinispan)"
              echo ""
              echo '```'
              cat "$PARITY_FILE"
              echo '```'
              echo ""
              echo "_Short single-host CI sweep, directional, not a release number._"
            } > /tmp/pr-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/pr-comment.md
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "Benchmark produced no parity file. Check the workflow logs."
          fi
