name: bench-b-redis-colocated
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512m

  keycloak:
    image: localhost:5011/keycloak:999.0.0-redis-iter6
    command: ["start-dev", "--hostname-strict=false", "--import-realm"]
    volumes:
      - ../realm-bench.json:/opt/keycloak/data/import/realm-bench.json:ro
      - ../realm-bench-kcb.json:/opt/keycloak/data/import/realm-bench-kcb.json:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_CACHE: redis
      KC_CACHE_REDIS_URL: redis://redis:6379
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: "INFO,org.keycloak.provider:DEBUG,org.keycloak.cache.redis:DEBUG,org.keycloak.connections.redis:DEBUG,org.keycloak.models.cache.redis:DEBUG,org.keycloak.services.DefaultKeycloakSession:DEBUG"
      JAVA_OPTS_APPEND: "-Xms512m -Xmx1500m"
    ports:
      - "18081:8080"
      - "19081:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/realms/master || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
