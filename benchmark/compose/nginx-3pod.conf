events { worker_connections 4096; }

http {
    upstream keycloak {
        # least_conn distributes across all 3 pods. ip_hash would pin
        # all traffic from a single-IP test client to one pod, defeating the
        # 3-pod test. Both vanilla and Skycloak handle non-sticky correctly:
        # vanilla replicates sessions across the cluster; Skycloak persists
        # sessions to JPA (any pod can serve any request).
        least_conn;
        server keycloak1:8080 max_fails=3 fail_timeout=10s;
        server keycloak2:8080 max_fails=3 fail_timeout=10s;
        server keycloak3:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        client_max_body_size 10m;
        # Pass-through real client info for KC's hostname/proxy logic.
        # $http_host includes the port from the original request (Host: 0.0.0.0:18083);
        # plain $host strips the port, which makes KC render form actions without it
        # → POST goes to port 80 → ECONNREFUSED.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        location / {
            proxy_pass http://keycloak;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
