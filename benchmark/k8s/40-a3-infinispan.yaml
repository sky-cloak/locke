# A3: vanilla Keycloak 26.6.1, embedded Infinispan, clustered via jdbc-ping.
# 3 pods, one per loading node (anti-affinity). Mirrors the operator's
# StatefulSet + headless-service JGroups pattern. Load target = kc-a3 ClusterIP.
apiVersion: v1
kind: Service
metadata: { name: kc-a3-headless, namespace: locke-bench }
spec:
  clusterIP: None
  selector: { app: kc-a3 }
  ports: [ { name: http, port: 8080 }, { name: jgroups, port: 7800 } ]
---
apiVersion: v1
kind: Service
metadata: { name: kc-a3, namespace: locke-bench }
spec:
  selector: { app: kc-a3 }
  ports: [ { name: http, port: 8080, targetPort: 8080 } ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kc-a3, namespace: locke-bench }
spec:
  serviceName: kc-a3-headless
  replicas: 3
  selector: { matchLabels: { app: kc-a3 } }
  template:
    metadata: { labels: { app: kc-a3 } }
    spec:
      nodeSelector: { bench-role: kc }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: { matchLabels: { app: kc-a3 } }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.1
          args: ["start-dev", "--hostname-strict=false", "--import-realm", "--health-enabled=true"]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: keycloak }
            - { name: KC_DB_PASSWORD, value: keycloak }
            - { name: KC_DB_POOL_MAX_SIZE, value: "50" }
            - { name: KC_CACHE, value: ispn }
            - { name: KC_CACHE_STACK, value: jdbc-ping }
            - { name: KC_METRICS_ENABLED, value: "true" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
            - { name: JAVA_OPTS_APPEND, value: "-Xms1g -Xmx3g" }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: jgroups, containerPort: 7800 }
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { memory: 4Gi }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
            - { name: dataset, mountPath: /opt/keycloak/providers/keycloak-benchmark-dataset.jar, subPath: keycloak-benchmark-dataset.jar, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: bench-realm }
        - name: dataset
          configMap: { name: dataset-provider }
