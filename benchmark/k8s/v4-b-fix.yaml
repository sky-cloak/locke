# #1 validation — Locke 26.6.2-2 (with the Redis fixes), PRODUCTION mode.
# NOTE: only KC_CACHE_REDIS_URL is set (NO KC_SPI_CONNECTIONS_REDIS__DEFAULT__URL workaround) —
# if pods connect to Redis, the --optimized URL fix is proven. Fail-fast timeout fix also in this image.
apiVersion: v1
kind: Service
metadata: { name: kc-b3-headless, namespace: locke-bench }
spec: { clusterIP: None, selector: { app: kc-b3 }, ports: [ { name: http, port: 8080 } ] }
---
apiVersion: v1
kind: Service
metadata: { name: kc-b3, namespace: locke-bench }
spec: { selector: { app: kc-b3 }, ports: [ { name: http, port: 8080, targetPort: 8080 } ] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kc-b3, namespace: locke-bench }
spec:
  serviceName: kc-b3-headless
  replicas: 3
  selector: { matchLabels: { app: kc-b3 } }
  template:
    metadata: { labels: { app: kc-b3 } }
    spec:
      nodeSelector: { bench-role: kc }
      imagePullSecrets: [ { name: ghcr-pull } ]
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: { matchLabels: { app: kc-b3 } }
      containers:
        - name: keycloak
          image: ghcr.io/sky-cloak/locke-bench-locke:26.6.2-2
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: keycloak }
            - { name: KC_DB_PASSWORD, value: keycloak }
            - { name: KC_DB_POOL_MAX_SIZE, value: "50" }
            - { name: KC_CACHE_REDIS_URL, value: "redis://redis:6379" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
            - { name: JAVA_OPTS_APPEND, value: "-Xms2g -Xmx4g -XX:+UseG1GC" }
          ports: [ { name: http, containerPort: 8080 }, { name: mgmt, containerPort: 9000 } ]
          resources:
            requests: { cpu: "6", memory: 6Gi }
            limits: { cpu: "6", memory: 6Gi }
          readinessProbe: { httpGet: { path: /health/ready, port: 9000 }, initialDelaySeconds: 20, periodSeconds: 5, failureThreshold: 60 }
